spring.application.name=plagiarism-detection

# Utiliser le port fourni par Clever Cloud
server.port=${PORT}

# Connexion à la base de données Clever Cloud
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/plagiarism-detection?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}  # Laissez vide si pas de mot de passe

# Décommenter cette ligne si vous utilisez MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Utiliser le dialecte MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true