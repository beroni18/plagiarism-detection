spring.application.name=plagiarism-detection

# Utiliser le port fourni par Clever Cloud
server.port=${PORT}

# Connexion � la base de donn�es Clever Cloud
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}  # Laissez vide si pas de mot de passe

# D�commenter cette ligne si vous utilisez MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Utiliser le dialecte MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
